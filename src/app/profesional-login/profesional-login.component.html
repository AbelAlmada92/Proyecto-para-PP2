<div class="login-contenedor">
  <div class="login-card">
    <h2>Login Profesional</h2>
    <p>Acceso para médicos y enfermeros</p>
    
    <div class="form-grupo">
      <label>DNI:</label>
      <input type="text" placeholder="00000000" maxlength="9">
    </div>

    <div class="form-grupo">
      <label>Contraseña:</label>
      <input type="password">
    </div>
    
    <div class="form-grupo">
      <label>Matrícula:</label>
      <input type="text">
    </div>
    
    <button class="ingreso">Ingresar</button>
    
    <button class="back" routerLink="/">← Volver</button>
  </div>
</div>
