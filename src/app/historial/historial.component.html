<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registro de Paciente - Mediroom</title>
 <!-- <link rel="stylesheet" href="styles.css"> -->
</head>
<body>
  <div class="contenedor">
    <div class="register-card">
      <h2>Registro de Paciente</h2>
      <p>Crea tu cuenta para acceder a tu historial médico</p>

      <form id="registerForm" class="register-form" novalidate>
        <div class="form-seccion">
          <h2>Información Personal</h2>

          <div class="form-grupo">
            <label for="nombres">Nombres *</label>
            <input id="nombres" name="nombres" type="text" placeholder="Nombres" class="form-input" required>
          </div>

          <div class="form-grupo">
            <label for="apellido">Apellido *</label>
            <input id="apellido" name="apellido" type="text" placeholder="Tu apellido" class="form-input" required>
          </div>

          <div class="form-grupo">
            <label for="nacimiento">Fecha de Nacimiento *</label>
            <input id="nacimiento" name="nacimiento" type="date" class="form-input" required>
          </div>

          <div class="form-grupo">
            <label for="documento">Documento *</label>
            <input id="documento" name="documento" type="text" placeholder="000000000" class="form-input" required>
          </div>

          <div class="form-grupo">
            <label for="genero">Género *</label>
            <select id="genero" name="genero" class="form-input genero" required>
              <option value="">Seleccionar</option>
              <option value="male">Masculino</option>
              <option value="female">Femenino</option>
              <option value="other">Otro</option>
            </select>
          </div>
        </div>

        <div class="form-seccion">
          <h2>Información de Contacto</h2>

          <div class="form-grupo">
            <label for="email">Email *</label>
            <input id="email" name="email" type="email" placeholder="tu@email.com" class="form-input" required>
          </div>

          <div class="form-grupo">
            <label for="telefono">Teléfono de Urgencia</label>
            <input id="telefono" name="telefono" type="tel" placeholder="+54 9 11 1234 5678" class="form-input">
          </div>

          <div class="form-grupo">
            <label for="direccion">Dirección</label>
            <input id="direccion" name="direccion" type="text" placeholder="Tu dirección" class="form-input">
          </div>
        </div>

        <div class="form-seccion">
          <h2>Información Médica</h2>

          <div class="form-grupo">
            <label for="obraSocial">Obra Social</label>
            <input id="obraSocial" name="obraSocial" type="text" placeholder="Obra Social" class="form-input">
          </div>

          <div class="form-grupo">
            <label for="grupoSanguineo">Grupo Sanguíneo</label>
            <select id="grupoSanguineo" name="grupoSanguineo" class="form-input">
              <option value="">Seleccionar</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>
          </div>

          <div class="form-grupo">
            <label for="medicacion">Medicación (actual)</label>
            <input id="medicacion" name="medicacion" type="text" placeholder="Ej: Metformina 850mg" class="form-input">
          </div>

          <div class="form-grupo">
            <label for="telefonoUrgencia">Teléfono de Urgencia</label>
            <input id="telefonoUrgencia" name="telefonoUrgencia" type="tel" placeholder="+54 9 11 0000 0000" class="form-input">
          </div>

          <div class="form-grupo">
            <label for="historiaClinica">Historia Clínica</label>
            <textarea id="historiaClinica" name="historiaClinica" placeholder="Antecedentes, alergias, observaciones" class="form-input textarea"></textarea>
          </div>

          <div class="form-grupo">
            <label for="enfermedad">Enfermedad principal (para alerta)</label>
            <input id="enfermedad" name="enfermedad" type="text" placeholder="Ej: Diabetes tipo 2" class="form-input">
          </div>
        </div>

        <div class="form-seccion">
          <h2>Credenciales de Acceso</h2>

          <div class="form-grupo">
            <label for="password">Contraseña *</label>
            <input id="password" name="password" type="password" placeholder="Mínimo 8 caracteres" class="form-input" required>
          </div>

          <div class="form-grupo">
            <label for="confirmPassword">Confirmar Contraseña *</label>
            <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Repite tu contraseña" class="form-input" required>
          </div>
        </div>

        <div class="botones">
          <button type="submit" class="register">Crear Cuenta</button>
          <button type="button" id="clearStorage" class="back">Borrar Todos</button>
        </div>
      </form>

      <!-- ALERTA VISIBLE -->
      <div id="alertaEnfermedad" class="alerta oculto" role="status" aria-live="polite">
        <strong id="alertaTexto"></strong>
      </div>

      <!-- LISTA DE PACIENTES -->
      <section class="lista-seccion">
        <h3>Pacientes Guardados</h3>
        <div id="listaPacientes" class="lista-pacientes"></div>
      </section>
    </div>
  </div>

  <!-- Cargar el JS compilado desde app.js -->
  <script src="app.js" type="module"></script>
</body>
</html>
